[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "klaaryo-contracts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "grpcio==1.68.1",
    "grpcio-tools==1.68.1",
    "protobuf==5.29.2",
]

[tool.setuptools.packages.find]
where = ["."] 
